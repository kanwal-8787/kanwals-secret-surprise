<!DOCTYPE html>
<html>
<head>
  <title>Kanwal ❤️</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: pink;
      padding-top: 100px;
    }

    h1 {
      font-size: 40px;
    }

    button {
      font-size: 20px;
      padding: 10px 25px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    #hearts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
    }
.heart{
position:fixed;
bottom:-30px;
font-size:30px;
animation:heartFloat 6s linear forwards;
}

@keyframes heartFloat{
0%{
transform:translateY(0);
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
  }
}

/* your old code stays here */
    
.balloon {
  position: fixed;
  bottom: -100px;
  font-size: 50px;
  animation: float 8s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(0);
  }
  100% {
    transform: translateY(-800px);
  }
}

.flower {
  position: fixed;
  top: -50px;
  font-size: 35px;
  animation: flowerFall 6s infinite;
}

@keyframes flowerFall {
  0% {
    transform: translateY(0) rotate(0deg);
  }
  100% {
    transform: translateY(800px) rotate(360deg);
  }
}

.confetti {
  font-size: 40px;
  animation: pop 1s infinite;
}

@keyframes pop {
  50% {
    transform: scale(1.3);
  }
}
.name {
  font-size: 50px;
  font-weight: bold;
  animation: glow 2s infinite;
}

@keyframes glow {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.2);
  }

  100% {
    transform: scale(1);
  }
}
.girl {
  font-size: 60px;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-20px);
    }
  }
  .photo-frame {
  display: inline-block;
  padding: 15px;
  border: 8px solid pink;
  border-radius: 30px;
  background: white;
  box-shadow: 0 0 20px red;
  position: relative;
}

.photo-frame::before {
  <div id="hearts"></div>
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}
.cake {
  font-size: 80px;
  animation: cut 3s infinite;
}

@keyframes cut {
  0% {
    transform: rotate(0deg);
  }

  50% {
    transform: rotate(-10deg);
  }

  100% {
    transform: rotate(0deg);
  }
}
.firework{
position:fixed;
font-size:60px;
animation:explode 1.2s ease-out forwards;
pointer-events:none;
}

@keyframes explode{
0%{
transform:scale(0);
opacity:1;
}
100%{
transform:scale(2);
opacity:0;
}
}
  </style>
</head>
<body>

<h1>🎁 Before Opening Your Birthday Surprise 🎁</h1>

<p>❤️ Kanwal, will you always stay my friend? 😊</p>

<button onclick="yesClick()">💖 YES</button>

<button id="noBtn" ontouchstart="moveNo()" onmouseover="moveNo()">❌ NO</button>

<script>
function yesClick() {
  document.body.innerHTML = `
<h1>😂 Oops...</h1>

<h2>You just accepted the</h2>

<h2>❤️ Terms & Conditions ❤️</h2>

<h3>of being my best friend forever! 🤭</h3>
`;

setTimeout(showBirthday, 2000);
}
  function showBirthday() {

document.body.innerHTML = `
...
`;

floatingHearts();
}
<h1>Aww❤️ I knew you'd say yes! 😂</h1>

<h1>🎂 Happy Birthday, Kanwal! 🎂</h1>

<h1 class="name">Kanwal ❤️</h1>

<div class="girl">👧✨</div>

<h2>✨ Wishing you a day full of happiness ✨</h2>

<h2>🎂 Cake Cutting Celebration 🎂</h2>

<div class="cake" onclick="cutCake(this)">🎂</div>

<p>👆 Tap the cake to cut it! ✨</p>

<p>👭👬 Celebrating your special day with friends ❤️</p>

<p>🎉 Everyone is cheering for you! 🎉</p>

<p>🍰 Make a wish and cut the cake ✨</p>

<div class="photo-frame">
<img src="Snapchat-1675800939.jpg" width="250">
</div>

<div id="hearts">❤️ ❤️ ❤️ ❤️ ❤️</div>

<div class="balloon" style="left:5%;">🎈</div>
<div class="balloon" style="left:25%;">🎈</div>
<div class="balloon" style="left:45%;">🎈</div>
<div class="balloon" style="left:65%;">🎈</div>
<div class="balloon" style="left:85%;">🎈</div>

<div class="flower">🌸</div>
<div class="flower">🌺</div>
<div class="flower">🌹</div>

<div class="confetti">🎉✨🎊</div>
<h2 style="color:red;">💌 A Special Message For You 💌</h2>

<p style="font-size:22px;line-height:35px;">
Happy Birthday, Kanwal! ❤️<br><br>

May your special day be filled with happiness,
laughter and unforgettable memories.<br><br>

Thank you for being such an amazing friend. ❤️<br><br>

May Allah bless you with good health,
success, peace and endless happiness.<br><br>

Never stop smiling. 😊<br><br>

🎂 Happy Birthday! 🎉❤️ janam

</p>
`;
}

function moveNo() {
  let button = document.getElementById("noBtn");
  button.style.position = "absolute";
  button.style.left = Math.random() * 300 + "px";
  button.style.top = Math.random() * 300 + "px";
}

function cutCake(cake) {

  cake.innerHTML = "🍰";

  let count = 0;

  let interval = setInterval(() => {

    fireworks();

    count++;

    if(count == 6){
      clearInterval(interval);
    }

  },700);

  document.body.innerHTML += `
    <h1 style="color:gold;">🎆 BOOM! 🎆</h1>

    <div style="font-size:70px;">
      🎆 ✨ 🎇 🎆 ✨ 🎇 🎆
    </div>

    <div style="font-size:60px;">
      🎉 🎊 🎉 🎊 🎉
    </div>

    <h2 style="color:red;">
      🎉 Happy Birthday Once Again, Kanwal! ❤️
    </h2>
  `;

  }

function fireworks(){

for(let i=0;i<20;i++){

let f=document.createElement("div");

f.className="firework";

f.innerHTML="🎆";

f.style.left=Math.random()*90+"vw";

f.style.top=Math.random()*70+"vh";

document.body.appendChild(f);

setTimeout(function(){
f.remove();
},1200);

}

}

function floatingHearts(){

setInterval(function(){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

document.body.appendChild(heart);

setTimeout(function(){
heart.remove();
},6000);

},400);

}

</script>
</body>
</html>
