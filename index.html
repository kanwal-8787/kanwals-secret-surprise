<!DOCTYPE html>
<html>
<head>
  <title>Kanwal ❤️</title>

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background: pink;
      padding-top: 100px;
    }

    h1 {
      font-size: 40px;
    }

    button {
      font-size: 20px;
      padding: 10px 25px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
    }
    #hearts {
  font-size: 40px;
  animation: fall 2s infinite;
}

@keyframes fall {
  0% {
    transform: translateY(-50px);
  }

  100% {
    transform: translateY(100px);
  }
}

/* your old code stays here */
    
.balloon {
  position: fixed;
  bottom: -100px;
  font-size: 50px;
  animation: float 5s infinite;
}

@keyframes float {
  0% {
    transform: translateY(0);
  }
  100% {
    transform: translateY(-800px);
  }
}

.flower {
  position: fixed;
  top: -50px;
  font-size: 35px;
  animation: flowerFall 6s infinite;
}

@keyframes flowerFall {
  0% {
    transform: translateY(0) rotate(0deg);
  }
  100% {
    transform: translateY(800px) rotate(360deg);
  }
}

.confetti {
  font-size: 40px;
  animation: pop 1s infinite;
}

@keyframes pop {
  50% {
    transform: scale(1.3);
  }
}
.name {
  font-size: 50px;
  font-weight: bold;
  animation: glow 2s infinite;
}

@keyframes glow {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.2);
  }

  100% {
    transform: scale(1);
  }
}
.girl {
  font-size: 60px;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-20px);
    }
  }
  .photo-frame {
  display: inline-block;
  padding: 15px;
  border: 8px solid pink;
  border-radius: 30px;
  background: white;
  box-shadow: 0 0 20px red;
  position: relative;
}

.photo-frame::before {
  content: "❤️ ❤️ ❤️ ❤️ ❤️";
  display: block;
  font-size: 25px;
  margin-bottom: 5px;
}
.cake {
  font-size: 80px;
  animation: cut 2s infinite;
}

@keyframes cut {
  0% {
    transform: rotate(0deg);
  }

  50% {
    transform: rotate(-10deg);
  }

  100% {
    transform: rotate(0deg);
  }
 }
  </style>
</head>
<body>

<h1>Hey Kanwal ❤️</h1>
<p>Will you do something for me? 😊</p>
<button onclick="yesClick()">Yes</button>
<button id="noBtn" ontouchstart="moveNo()">No</button>

<script>
function yesClick() {
  document.body.innerHTML = `
    <h1>🎂 Happy Birthday</h1>
    <h1 class="name">Kanwal ❤️</h1>
    <div class="girl">👧✨</div>
    <h2>✨ Wishing you a day full of happiness ✨</h2>

    <h2>🎂 Cake Cutting Celebration 🎂</h2>
    <div class="cake" onclick="cutCake(this)">🎂</div>
    <p>👆 Tap the cake to cut it! ✨</p>

    <p>👭👬 Celebrating your special day with friends ❤️</p>
    <p>🎉 Everyone is cheering for you! 🎉</p>
    <p>🍰 Make a wish and cut the cake ✨</p>

    <div class="photo-frame">
      <img src="Snapchat-1675800939.jpg" width="250">
    </div>

    <div id="hearts">❤️ ❤️ ❤️ ❤️ ❤️</div>

    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>
    <div class="balloon">🎈</div>

    <div class="flower">🌸</div>
    <div class="flower">🌺</div>
    <div class="flower">🌹</div>

    <div class="confetti">🎉✨🎊</div>
  `;
}

function moveNo() {
  let button = document.getElementById("noBtn");
  button.style.position = "absolute";
  button.style.left = Math.random() * 300 + "px";
  button.style.top = Math.random() * 300 + "px";
}

function cutCake(cake) {
  cake.innerHTML = "🍰";
  alert("🎉 Yay! Happy Birthday Kanwal! 🎂❤️");
    }
</script>

</body>
</html>
